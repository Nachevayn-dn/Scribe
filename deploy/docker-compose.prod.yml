# Production-style overrides: built images (no bind mounts/hot-reload),
# restart policies, and a Caddy reverse proxy in front for automatic TLS.
#
# Usage (from repo root):
#   cp deploy/.env.prod.example deploy/.env.prod   # fill in real secrets + your domain
#   docker compose -f deploy/docker-compose.yml -f deploy/docker-compose.prod.yml \
#     --env-file deploy/.env.prod up -d --build

services:
  postgres:
    ports: !reset []
    restart: unless-stopped

  backend:
    command: sh -c "alembic upgrade head && uvicorn app.main:app --host 0.0.0.0 --port 8000"
    environment:
      CORS_ORIGINS: '["https://${DOMAIN}"]'
      # Both derived from DOMAIN — no need to set them separately in
      # .env.prod. PUBLIC_BASE_URL is where Twilio calls back to;
      # FRONTEND_BASE_URL is what gets embedded in emailed links (e.g. the
      # doctor "set your password" link).
      PUBLIC_BASE_URL: https://${DOMAIN}
      FRONTEND_BASE_URL: https://${DOMAIN}
    volumes: !override
      - audio_data:/app/data/audio
      - avatar_data:/app/data/avatars
      - document_data:/app/data/documents
      - announcement_data:/app/data/announcements
      - clinic_logo_data:/app/data/clinic-logos
    ports: !reset []
    restart: unless-stopped

  frontend:
    image: !reset null
    build:
      context: ../frontend
    command: !reset null
    environment: !reset {}
    volumes: !reset []
    ports: !reset []
    restart: unless-stopped

  caddy:
    image: caddy:2-alpine
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
    environment:
      DOMAIN: ${DOMAIN}
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config
    depends_on:
      - frontend
      - backend

volumes:
  caddy_data:
  caddy_config:
