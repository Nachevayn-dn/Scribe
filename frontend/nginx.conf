server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    # Backend API — proxied to the "backend" service on the compose network.
    location /api/ {
        proxy_pass http://backend:8000/api/;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # Uploaded doctor profile photos (see backend services/avatar_storage.py).
    location /static/ {
        proxy_pass http://backend:8000/static/;
        proxy_set_header Host $host;
    }

    # Vite's hashed build output (assets/index-<hash>.js etc.) — the
    # filename itself changes whenever the content does, so these are safe
    # to cache forever; a new deploy is served under new filenames, never a
    # stale one under an old name.
    location /assets/ {
        add_header Cache-Control "public, max-age=31536000, immutable";
    }

    # index.html is NOT hashed and references whichever asset filenames the
    # last build produced — it must always be revalidated with the server on
    # each load, or a browser can keep serving a deploy from before this one
    # (pointing at JS bundles that no longer exist) until its own cache
    # expires. no-cache still allows an efficient 304 when unchanged; it
    # just forbids serving a stale copy without asking first.
    location = /index.html {
        add_header Cache-Control "no-cache";
    }

    # SPA fallback: client-side routes (React Router) all resolve to index.html.
    location / {
        add_header Cache-Control "no-cache";
        try_files $uri /index.html;
    }

    gzip on;
    gzip_types text/css application/javascript application/json image/svg+xml;
}
