<!doctype html>
<html>
<head>
<meta charset="utf-8" />
<title>MedicDesk.ai</title>
<style>
  body {
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
    width: 300px;
    padding: 14px;
    background: #0a0f0c;
    color: #e8ece9;
  }
  h1 { font-size: 14px; margin: 0 0 4px; font-weight: 700; }
  p { font-size: 12px; color: #9aa79f; margin: 4px 0; line-height: 1.4; }
  .preview {
    max-height: 140px;
    overflow-y: auto;
    background: #141a16;
    border: 1px solid #26392e;
    border-radius: 6px;
    padding: 8px;
    font-size: 11px;
    white-space: pre-wrap;
    margin: 8px 0;
  }
  button {
    width: 100%;
    padding: 9px;
    background: #e0a83a;
    color: #0a0f0c;
    border: none;
    border-radius: 6px;
    font-weight: 700;
    font-size: 13px;
    cursor: pointer;
    margin-top: 4px;
  }
  button:disabled { opacity: 0.5; cursor: default; }
  .status { font-size: 12px; margin-top: 8px; min-height: 14px; }
  .status.ok { color: #4ade80; }
  .status.error { color: #f87171; }
</style>
</head>
<body>
  <h1>MedicDesk.ai → PMS</h1>
  <p id="empty-state">
    No note copied yet. Open a note in MedicDesk.ai and click "Copy for PMS" first.
  </p>
  <div id="preview-wrap" style="display:none">
    <p>Last copied note:</p>
    <div class="preview" id="preview"></div>
    <p>Click into a field on this page, then:</p>
    <button id="paste-btn">Paste into focused field</button>
    <div class="status" id="status"></div>
  </div>
  <script src="popup.js"></script>
</body>
</html>
